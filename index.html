<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" />
    <meta name="description" content="Dashboard demo for Pakistan’s international voice traffic." />
    <link rel="icon" type="image/png" href="./VOXIA Logo.png" />
    <title>Dashboard</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('voxia-theme'); } catch {}
        const dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0d1424' : '#f4f6fb';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
